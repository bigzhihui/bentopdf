name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Candidate commit to verify (empty uses this workflow ref)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tests-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
    outputs:
      candidate: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Record exact candidate
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test upstream merge safeguards
        run: npm run test:upstream-sync
      - name: Run tests
        run: npm run test:run -- --maxWorkers=2

  pages:
    needs: test
    uses: ./.github/workflows/seo-audit.yml
    with:
      ref: ${{ needs.test.outputs.candidate }}

  report:
    needs: [test, pages]
    if: always() && needs.test.outputs.candidate != ''
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      # No candidate checkout or code execution in this reporting job.
      - name: Attach validation result to the candidate commit
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ needs.test.outputs.candidate }}
          VALIDATION_RESULT: ${{ needs.test.result }}:${{ needs.pages.result }}
        with:
          script: |
            const sha = process.env.CANDIDATE_SHA;
            if (!/^[a-f0-9]{40}$/i.test(sha)) throw new Error('Invalid candidate SHA');
            const success = process.env.VALIDATION_RESULT === 'success:success';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha,
              state: success ? 'success' : 'failure',
              context: 'PDF validation',
              description: success ? 'Types, tests, Pages build and SEO passed' : 'Validation failed or did not finish',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
