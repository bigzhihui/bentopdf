name: Update Sponsors
on:
  workflow_dispatch:
jobs:
  update:
    if: github.repository == 'alam00000/bentopdf'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JamesIves/github-sponsors-readme-action@v1
        with:
          token: ${{ secrets.SPONSORS_TOKEN }}
          file: 'README.md'
