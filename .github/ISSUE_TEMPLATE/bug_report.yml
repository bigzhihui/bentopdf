name: 故障反馈
description: 报告十三月 PDF 工具的可复现问题
title: '[故障] '
labels: [bug, needs triage]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有问题。公开内容请脱敏，不要上传私人 PDF、密码或密钥；安全问题请发 support@afeiii.com。
  - type: input
    id: tool
    attributes:
      label: 工具或页面
      placeholder: 例如合并 PDF、OCR、注释，或具体网址
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 实际结果与期望结果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 说明文件类型、操作顺序；可用脱敏文件或构造方法复现。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 浏览器和操作系统
      placeholder: 例如 Windows 11，Chrome 版本号
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、错误日志或脱敏示例（可选）
      description: 日志可从 F12 → Console 查看；不能提供文件时请描述构造方法。
