name: Pages build and SEO audit

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 'Candidate commit to verify'
        required: false
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HUSKY: 0
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Pages distribution and audit SEO
        run: npm run build:pages
      - name: Install browser for real PDF verification
        run: npx playwright install --with-deps chromium
      - name: Verify generated site and actual PDF downloads
        env:
          PDF_SMOKE_EXPECTED_COMMIT: ${{ inputs.ref || github.sha }}
          PDF_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/pdf-smoke
        run: npm run test:smoke
      - name: Retain small browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/pdf-smoke
          if-no-files-found: ignore
          retention-days: 3
